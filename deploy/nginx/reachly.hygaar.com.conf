# Reachly hosted app for Hygaar.
# SSL can terminate at ALB/CloudFront. This vhost proxies the app service on 8050.

server {
    listen 80;
    server_name reachly.hygaar.com;

    access_log /var/log/nginx/reachly-hygaar-access.log combined;
    error_log  /var/log/nginx/reachly-hygaar-error.log warn;

    client_max_body_size 16M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
